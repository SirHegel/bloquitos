<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow-1" cx="20%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="85%" cy="15%" r="62%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-3" cx="50%" cy="120%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1030" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="block-I" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="block-O" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="block-T" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="block-S" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="block-Z" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="block-J" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="block-L" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="25%" stop-color="#c4b5fd" />
      <stop offset="50%" stop-color="#fda4af" />
      <stop offset="75%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <filter id="jewel-glow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="text-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#c4b5fd" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo Base -->
  <rect width="1200" height="630" fill="#0d1030"/>
  <rect width="1200" height="630" fill="url(#bg-glow-1)"/>
  <rect width="1200" height="630" fill="url(#bg-glow-2)"/>
  <rect width="1200" height="630" fill="url(#bg-glow-3)"/>

  <!-- Composicion de Bloques -->
  <g filter="url(#jewel-glow)">
    
    <!-- Bloque O (Amarillo) -->
    <g transform="translate(130, 180) rotate(-15)">
      <rect x="0" y="0" width="120" height="120" rx="20" fill="url(#block-O)" stroke="#fef08a" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M 60 0 V 120 M 0 60 H 120" stroke="rgba(0,0,0,0.25)" stroke-width="2" />
      <path d="M 12 12 L 108 12 M 12 12 L 12 108" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Bloque I (Cian) -->
    <g transform="translate(160, 470) rotate(12)">
      <rect x="0" y="0" width="240" height="60" rx="20" fill="url(#block-I)" stroke="#a5f3fc" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M 60 0 V 60 M 120 0 V 60 M 180 0 V 60" stroke="rgba(0,0,0,0.25)" stroke-width="2" />
      <path d="M 12 12 L 228 12 M 12 12 L 12 48" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Bloque T (Purpura) -->
    <g transform="translate(860, 100) rotate(22)">
      <path d="M 20 0 H 160 A 20 20 0 0 1 180 20 V 40 A 20 20 0 0 1 160 60 H 120 V 100 A 20 20 0 0 1 100 120 H 80 A 20 20 0 0 1 60 120 V 60 H 20 A 20 20 0 0 1 0 40 V 20 A 20 20 0 0 1 20 0 Z" fill="url(#block-T)" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M 60 0 V 60 M 120 0 V 60 M 60 60 H 120" stroke="rgba(0,0,0,0.25)" stroke-width="2" />
      <path d="M 12 12 L 168 12 M 12 12 L 12 48" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Bloque Z (Rojo) -->
    <g transform="translate(880, 440) rotate(-18)">
      <path d="M 20 0 H 100 A 20 20 0 0 1 120 20 V 60 H 160 A 20 20 0 0 1 180 80 V 100 A 20 20 0 0 1 160 120 H 80 A 20 20 0 0 1 60 100 V 60 H 20 A 20 20 0 0 1 0 40 V 20 A 20 20 0 0 1 20 0 Z" fill="url(#block-Z)" stroke="#fecdd3" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M 60 0 V 60 M 120 60 V 120 M 60 60 H 120" stroke="rgba(0,0,0,0.25)" stroke-width="2" />
      <path d="M 12 12 L 108 12 M 12 12 L 12 48" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Bloque L (Naranja) -->
    <g transform="translate(90, 60) rotate(45) scale(0.8)">
      <path d="M 20 0 H 40 A 20 20 0 0 1 60 20 V 120 H 100 A 20 20 0 0 1 120 140 V 160 A 20 20 0 0 1 100 180 H 20 A 20 20 0 0 1 0 160 V 20 A 20 20 0 0 1 20 0 Z" fill="url(#block-L)" stroke="#fed7aa" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M 0 60 H 60 M 0 120 H 60 M 60 120 V 180" stroke="rgba(0,0,0,0.25)" stroke-width="2" />
      <path d="M 12 12 L 48 12 M 12 12 L 12 168" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Bloque J (Azul) -->
    <g transform="translate(1040, 280) rotate(-40) scale(0.8)">
      <path d="M 80 0 H 100 A 20 20 0 0 1 120 20 V 160 A 20 20 0 0 1 100 180 H 20 A 20 20 0 0 1 0 160 V 140 A 20 20 0 0 1 20 120 H 60 V 20 A 20 20 0 0 1 80 0 Z" fill="url(#block-J)" stroke="#bfdbfe" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M 60 60 H 120 M 60 120 H 120 M 60 120 V 180" stroke="rgba(0,0,0,0.25)" stroke-width="2" />
      <path d="M 72 12 L 108 12 M 72 12 L 72 108" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Bloque S (Verde) -->
    <g transform="translate(390, 530) rotate(15) scale(0.8)">
      <path d="M 80 0 H 160 A 20 20 0 0 1 180 20 V 40 A 20 20 0 0 1 160 60 H 120 V 100 A 20 20 0 0 1 100 120 H 20 A 20 20 0 0 1 0 100 V 80 A 20 20 0 0 1 20 60 H 60 V 20 A 20 20 0 0 1 80 0 Z" fill="url(#block-S)" stroke="#bbf7d0" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M 120 0 V 60 M 60 60 V 120 M 60 60 H 120" stroke="rgba(0,0,0,0.25)" stroke-width="2" />
      <path d="M 72 12 L 168 12 M 72 12 L 72 48" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Tipografia -->
  <g text-anchor="middle">
    <!-- Sombra del texto principal -->
    <text x="600" y="340" font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif" font-size="160" font-weight="900" letter-spacing="-3" fill="rgba(0,0,0,0.5)">Bloquitos</text>
    
    <!-- Texto principal con degradado y glow -->
    <text x="600" y="335" font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif" font-size="160" font-weight="900" letter-spacing="-3" fill="url(#text-gradient)" filter="url(#text-shadow)">Bloquitos</text>
    
    <!-- Subtitulo -->
    <text x="600" y="430" font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="rgba(240, 244, 255, 0.85)">Bloques que caen, niveles infinitos</text>
  </g>
</svg>
